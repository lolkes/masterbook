<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>MasterBook</title>
<link rel="stylesheet" href="/style.css?v=8">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app-status" class="app-status">● Подключение…</div>
<main class="app">
<header class="topbar">
  <div class="brand"><div class="logo">M</div><div><b>MasterBook</b><small>Учёт бизнеса мастера</small></div></div>
  <div class="top-actions"><button class="icon-btn" onclick="downloadExport()" aria-label="Экспорт">⇩</button><button class="icon-btn" onclick="loadAll()" aria-label="Обновить">↻</button></div>
</header>
<section class="hero"><div><span>Чистая прибыль</span><strong id="profit">0 ₽</strong><small id="periodLabel">За всё время</small></div><div class="hero-side"><div class="hero-icon">↗</div><span class="hero-caption">Сегодня в работе</span></div></section>
<div class="periods"><button class="period active" data-period="all" onclick="setPeriod('all')">Всё</button><button class="period" data-period="month" onclick="setPeriod('month')">Месяц</button><button class="period" data-period="week" onclick="setPeriod('week')">7 дней</button></div>
<section class="stats">
  <div class="stat"><span>💰 Доход</span><strong id="income">0 ₽</strong></div>
  <div class="stat"><span>💸 Расходы</span><strong id="expenses">0 ₽</strong></div>
  <div class="stat"><span>👥 Клиенты</span><strong id="clientsCount">0</strong></div>
  <div class="stat"><span>🔧 Работы</span><strong id="jobsCount">0</strong></div>
</section>
<button class="primary primary-main" onclick="openJob()"><span class="plus">＋</span><span><b>Новая работа</b><small>Добавить заказ и сразу посчитать прибыль</small></span><span class="arrow">›</span></button>
<section class="quick"><button onclick="openClient()"><span>👤</span><b>Клиент</b><small>Новый заказчик</small></button><button onclick="openExpense()"><span>💸</span><b>Расход</b><small>Добавить затраты</small></button></section>
<nav class="tabs"><button class="tab active" data-tab="jobs" onclick="showTab('jobs')">Работы</button><button class="tab" data-tab="clients" onclick="showTab('clients')">Клиенты</button><button class="tab" data-tab="expenses" onclick="showTab('expenses')">Расходы</button></nav>
<section id="jobsSection" class="panel"><div class="section-head"><div><h2>Работы</h2><small>Последние заказы</small></div><button class="section-add" onclick="openJob()">＋</button></div><input class="search" id="jobsSearch" oninput="renderJobs()" placeholder="🔎 Поиск работы или клиента"><div id="jobsList"></div></section>
<section id="clientsSection" class="panel hidden"><div class="section-head"><div><h2>Клиенты</h2><small>Ваши заказчики</small></div><button class="section-add" onclick="openClient()">＋</button></div><input class="search" id="clientsSearch" oninput="renderClients()" placeholder="🔎 Поиск клиента"><div id="clientsList"></div></section>
<section id="expensesSection" class="panel hidden"><div class="section-head"><div><h2>Расходы</h2><small>Контроль затрат</small></div><button class="section-add" onclick="openExpense()">＋</button></div><input class="search" id="expensesSearch" oninput="renderExpenses()" placeholder="🔎 Поиск расхода"><div id="expensesList"></div></section>
</main>
<div id="toast"></div>

<div id="clientModal" class="modal hidden"><div class="card"><button class="x" onclick="closeModal('clientModal')">×</button><h2 id="clientModalTitle">Новый клиент</h2><form onsubmit="saveClient(event)"><input id="clientId" type="hidden"><label>Имя<input id="clientName" placeholder="Например, Алексей" required></label><label>Телефон<input id="clientPhone" placeholder="+7 900 000-00-00"></label><label>Адрес<input id="clientAddress" placeholder="Адрес клиента"></label><button class="primary">Сохранить</button></form></div></div>
<div id="jobModal" class="modal hidden"><div class="card"><button class="x" onclick="closeModal('jobModal')">×</button><h2 id="jobModalTitle">Новая работа</h2><form onsubmit="saveJob(event)"><input id="jobId" type="hidden"><label>Клиент<select id="jobClient"><option value="">Без клиента</option></select></label><label>Услуга<input id="jobService" placeholder="Например, монтаж кухни" required></label><div class="row"><label>Цена<input id="jobPrice" type="number" min="0" step="0.01" placeholder="₽" required></label><label>Расходы<input id="jobExpenses" type="number" min="0" step="0.01" value="0" placeholder="₽"></label></div><label>Дата<input id="jobDate" type="date" required></label><label>Адрес<input id="jobAddress" placeholder="Адрес работы"></label><label>Статус<select id="jobStatus"><option value="new">Новая</option><option value="progress">В работе</option><option value="done">Выполнена</option><option value="cancelled">Отменена</option></select></label><label>Оплата<select id="jobPayment"><option value="unpaid">Не оплачено</option><option value="partial">Частично</option><option value="paid">Оплачено</option></select></label><label>Комментарий<textarea id="jobComment" placeholder="Дополнительная информация"></textarea></label><button class="primary">Сохранить работу</button></form></div></div>
<div id="expenseModal" class="modal hidden"><div class="card"><button class="x" onclick="closeModal('expenseModal')">×</button><h2 id="expenseModalTitle">Новый расход</h2><form onsubmit="saveExpense(event)"><input id="expenseId" type="hidden"><label>На что расход<input id="expenseTitle" placeholder="Материалы, бензин..." required></label><label>Сумма<input id="expenseAmount" type="number" min="0" step="0.01" placeholder="₽" required></label><label>Дата<input id="expenseDate" type="date" required></label><label>Комментарий<textarea id="expenseComment" placeholder="Необязательно"></textarea></label><button class="primary">Сохранить расход</button></form></div></div>
<script src="/app.js?v=8"></script>
</body>
</html>
