<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MasterBook</title><link rel="stylesheet" href="/style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body><main class="app"><header><div><b>MASTERBOOK</b><small>Работа мастера — под контролем</small></div><button onclick="loadAll()">↻</button></header><section class="grid"><div><span>💰 Доход</span><strong id="income">0 ₽</strong></div><div><span>💸 Расходы</span><strong id="expenses">0 ₽</strong></div><div><span>📈 Прибыль</span><strong id="profit">0 ₽</strong></div><div><span>👥 Клиенты</span><strong id="clientsCount">0</strong></div><div><span>🔧 Работы</span><strong id="jobsCount">0</strong></div></section><button class="primary" onclick="openModal('jobModal')">➕ Новая работа</button><section class="menu"><button onclick="show('clientsSection')">👥 Клиенты</button><button onclick="show('jobsSection')">🔧 Работы</button><button onclick="openModal('clientModal')">👤 Новый клиент</button><button onclick="openModal('expenseModal')">💸 Расход</button></section><section id="clientsSection" class="hidden"><h2>Клиенты</h2><div id="clientsList"></div></section><section id="jobsSection" class="hidden"><h2>Последние работы</h2><div id="jobsList"></div></section></main><div id="toast"></div><div id="clientModal" class="modal hidden"><div class="card"><button class="x" onclick="closeModal('clientModal')">×</button><h2>Новый клиент</h2><form onsubmit="saveClient(event)"><input id="clientName" placeholder="Имя клиента" required><input id="clientPhone" placeholder="Телефон"><input id="clientAddress" placeholder="Адрес"><button class="primary">Сохранить</button></form></div></div><div id="jobModal" class="modal hidden"><div class="card"><button class="x" onclick="closeModal('jobModal')">×</button><h2>Новая работа</h2><form onsubmit="saveJob(event)"><select id="jobClient"><option value="">Без клиента</option></select><input id="jobService" placeholder="Услуга" required><input id="jobPrice" type="number" min="0" step="0.01" placeholder="Цена, ₽" required><input id="jobExpenses" type="number" min="0" step="0.01" value="0" placeholder="Расходы, ₽"><input id="jobAddress" placeholder="Адрес"><input id="jobDate" type="date" required><textarea id="jobComment" placeholder="Комментарий"></textarea><button class="primary">Добавить работу</button></form></div></div><div id="expenseModal" class="modal hidden"><div class="card"><button class="x" onclick="closeModal('expenseModal')">×</button><h2>Новый расход</h2><form onsubmit="saveExpense(event)"><input id="expenseTitle" placeholder="На что расход" required><input id="expenseAmount" type="number" min="0" step="0.01" placeholder="Сумма, ₽" required><input id="expenseDate" type="date" required><textarea id="expenseComment" placeholder="Комментарий"></textarea><button class="primary">Добавить расход</button></form></div></div><script src="/app.js"></script></body></html>
